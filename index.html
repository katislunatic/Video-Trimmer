<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Trimmer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎬 Video Trimmer</h1>

  <input type="file" id="videoUpload" accept="video/*" />
  <video id="videoPreview" controls></video>

  <div class="controls">
    <label>Start: <input type="range" id="startRange" min="0" step="0.1" value="0"></label>
    <label>End: <input type="range" id="endRange" min="0" step="0.1" value="0"></label>
  </div>

  <select id="formatSelect">
    <option value="mp4">.mp4</option>
    <option value="mp3">.mp3 (audio only)</option>
  </select>

  <button id="trimBtn">Trim & Download</button>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
